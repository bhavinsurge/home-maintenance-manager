services:
  postgres:
    image: postgres:16-alpine
    container_name: hmm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hmm
      POSTGRES_PASSWORD: hmm_dev_password
      POSTGRES_DB: home_maintenance
    ports:
      - "5434:5432"
    volumes:
      - hmm_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmm -d home_maintenance"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hmm-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - hmm_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: hmm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - hmm_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: hmm-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/home-maintenance;
      mc anonymous set download local/home-maintenance/public || true;
      exit 0;
      "

volumes:
  hmm_pg_data:
  hmm_redis_data:
  hmm_minio_data:
